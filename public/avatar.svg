<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21132E" />
      <stop offset="50%" stop-color="#180E28" />
      <stop offset="100%" stop-color="#0B0813" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9560F5" />
      <stop offset="50%" stop-color="#D45AC5" />
      <stop offset="100%" stop-color="#F0A6E9" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E" />
      <stop offset="100%" stop-color="#3D2952" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D0B3" />
      <stop offset="100%" stop-color="#E5B28B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)" />

  <!-- Outer Holographic Tech Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="10 14" opacity="0.8" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="#9560F5" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="#D45AC5" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 8" />

  <!-- Outer Orbit Nodes -->
  <circle cx="340" cy="140" r="5" fill="#9560F5" filter="url(#softGlow)" />
  <circle cx="60" cy="250" r="4" fill="#D45AC5" filter="url(#softGlow)" />
  <circle cx="280" cy="340" r="6" fill="#F0A6E9" filter="url(#softGlow)" />

  <!-- Inner Ambient Aura -->
  <circle cx="200" cy="190" r="110" fill="#9560F5" opacity="0.15" filter="url(#softGlow)" />

  <!-- Back Hair Silhouette -->
  <path d="M120 180 C110 260, 100 320, 110 360 C140 370, 260 370, 290 360 C300 320, 290 260, 280 180 Z" fill="url(#hairGrad)" />

  <!-- Torso & Futuristic Tech Blazer -->
  <path d="M110 370 C130 310, 160 300, 200 300 C240 300, 270 310, 290 370 Z" fill="#241838" />
  <path d="M165 300 L200 345 L235 300 Z" fill="url(#skinGrad)" />
  <!-- Lapel Accents -->
  <path d="M150 310 L190 370 L175 370 L135 320 Z" fill="#9560F5" opacity="0.6" />
  <path d="M250 310 L210 370 L225 370 L265 320 Z" fill="#D45AC5" opacity="0.6" />

  <!-- Neck -->
  <rect x="185" y="240" width="30" height="40" rx="8" fill="url(#skinGrad)" />

  <!-- Face -->
  <path d="M150 170 C150 120, 250 120, 250 170 C250 230, 220 260, 200 260 C180 260, 150 230, 150 170 Z" fill="url(#skinGrad)" />

  <!-- Front Hair & Styling -->
  <path d="M145 160 C145 105, 255 105, 255 160 C255 175, 250 195, 248 200 C240 160, 220 145, 195 145 C165 145, 155 170, 150 200 C148 190, 145 175, 145 160 Z" fill="url(#hairGrad)" />

  <!-- Eyes & Eyebrows -->
  <path d="M168 180 Q178 174 186 180" stroke="#2D1C38" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M214 180 Q222 174 232 180" stroke="#2D1C38" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <circle cx="177" cy="190" r="3.5" fill="#361B4D" />
  <circle cx="223" cy="190" r="3.5" fill="#361B4D" />
  <circle cx="178.5" cy="188.5" r="1.2" fill="#FFFFFF" />
  <circle cx="224.5" cy="188.5" r="1.2" fill="#FFFFFF" />

  <!-- Nose & Smile -->
  <path d="M198 195 Q200 206 203 207" stroke="#D39873" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <path d="M188 222 Q200 232 212 222" stroke="#B84E7B" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Tech Earring Hologram -->
  <circle cx="146" cy="205" r="3.5" fill="#9560F5" filter="url(#softGlow)" />
  <line x1="146" y1="205" x2="146" y2="218" stroke="#D45AC5" stroke-width="1.5" />
  <circle cx="146" cy="220" r="2.5" fill="#F0A6E9" />

  <!-- Glowing Neural Headset Arc -->
  <path d="M138 175 C138 120, 262 120, 262 175" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-opacity="0.85" filter="url(#softGlow)" />
  <circle cx="262" cy="175" r="4.5" fill="#D45AC5" filter="url(#softGlow)" />

  <!-- Floating UI Terminal Badges -->
  <g transform="translate(48, 50)" opacity="0.95">
    <rect width="90" height="26" rx="13" fill="#180E28" stroke="#9560F5" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#10B981" />
    <text x="24" y="17" fill="#F0A6E9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">AI / ML Eng</text>
  </g>

  <g transform="translate(262, 50)" opacity="0.95">
    <rect width="90" height="26" rx="13" fill="#180E28" stroke="#D45AC5" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#9560F5" />
    <text x="24" y="17" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Full-Stack</text>
  </g>
</svg>

